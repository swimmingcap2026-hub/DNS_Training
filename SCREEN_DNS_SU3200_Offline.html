<html lang="zh-Hant">
<head>

<title>SCREEN DNS SU-3200 WET — 訓練系統 / Training System</title>
<meta name="description" content="Interactive 3D training courseware for a SCREEN DNS SU-3200 style single-wafer wet cleaning system: exploded view, cross section, x-ray enclosure, per-chamber process flow, zh/en/ja.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f6feb'/><circle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.4'/><circle cx='16' cy='16' r='2' fill='white'/></svg>">
<style>/* ==========================================================================
   SU-3200 WET training system — white-background UI
   ========================================================================== */
:root {
  --bg: #ffffff;
  --bg-soft: #f6f9fc;
  --bg-soft2: #eef3f8;
  --ink: #16202c;
  --ink-2: #3c4a5a;
  --muted: #6b7a8d;
  --line: #e3eaf2;
  --line-2: #d4dfea;
  --accent: #1f6feb;
  --accent-soft: #e8f1ff;
  --teal: #00a396;
  --violet: #8b5cf6;
  --amber: #f0932b;
  --rose: #e05260;
  --green: #1a9e5c;
  --radius: 12px;
  --shadow-s: 0 1px 2px rgba(16, 32, 52, .06), 0 2px 8px rgba(16, 32, 52, .05);
  --shadow-m: 0 4px 18px rgba(16, 32, 52, .10);
  --font: "Helvetica Neue", "Segoe UI", Roboto, "Noto Sans TC", "Noto Sans JP",
          "Hiragino Sans", "Microsoft JhengHei", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

body { display: flex; flex-direction: column; overflow: hidden; }

/* ---------- header ---------- */
.app-header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--line);
  background: #fff;
  flex: none;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  width: 38px; height: 38px; flex: none; border-radius: 10px;
  background: linear-gradient(135deg, #1f6feb 0%, #00a396 100%);
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px;
  letter-spacing: .5px;
}
.brand-text { min-width: 0; }
.brand-text h1 {
  margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand-text p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

.header-spacer { flex: 1; }

.lang-switch { display: flex; gap: 4px; background: var(--bg-soft); padding: 4px; border-radius: 10px; }
.lang-switch button {
  border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 13px;
  padding: 6px 12px; border-radius: 7px; cursor: pointer; transition: .15s;
}
.lang-switch button:hover { background: #fff; }
.lang-switch button.active { background: var(--accent); color: #fff; box-shadow: var(--shadow-s); }

/* ---------- tabs ---------- */
.tabbar {
  display: flex; gap: 2px; padding: 0 18px; border-bottom: 1px solid var(--line);
  background: #fff; flex: none; overflow-x: auto;
}
.tabbar button {
  border: 0; background: none; font: inherit; font-size: 14px; color: var(--muted);
  padding: 12px 16px; cursor: pointer; border-bottom: 2px solid transparent;
  white-space: nowrap; transition: .15s;
}
.tabbar button:hover { color: var(--ink); }
.tabbar button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

/* ---------- layout ---------- */
main { flex: 1; min-height: 0; position: relative; }
.tabpanel { position: absolute; inset: 0; display: none; }
.tabpanel.active { display: block; }

.workspace {
  display: grid;
  grid-template-columns: 286px minmax(0, 1fr) 348px;
  height: 100%;
}
.panel-left, .panel-right {
  overflow-y: auto; background: #fff; display: flex; flex-direction: column;
}
.panel-left { border-right: 1px solid var(--line); }
.panel-right { border-left: 1px solid var(--line); }

.panel-head {
  padding: 12px 14px 8px; position: sticky; top: 0; background: #fff; z-index: 2;
  border-bottom: 1px solid var(--line);
}
.panel-head h2 { margin: 0 0 6px; font-size: 13px; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
.panel-hint { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin: 0; }

.search-box {
  width: 100%; padding: 8px 10px; font: inherit; font-size: 13px; margin-bottom: 8px;
  border: 1px solid var(--line-2); border-radius: 9px; background: var(--bg-soft); color: var(--ink);
}
.search-box:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

/* ---------- part list ---------- */
.part-groups { padding: 6px 8px 24px; }
.group-title {
  font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
  color: var(--muted); padding: 12px 8px 5px; display: flex; align-items: center; gap: 6px;
}
.group-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.part-item {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 8px 9px; border: 0; background: none; font: inherit; font-size: 13px;
  color: var(--ink-2); text-align: left; border-radius: 9px; cursor: pointer; transition: .12s;
}
.part-item:hover { background: var(--bg-soft); color: var(--ink); }
.part-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.part-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- viewport ---------- */
.viewport { position: relative; background: #fff; overflow: hidden; }
.canvas-host { position: absolute; inset: 0; }
.viewport canvas { display: block; }
.label-layer { position: absolute; inset: 0; pointer-events: none; }
.part-label {
  position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer;
  background: rgba(255, 255, 255, .92); border: 1px solid var(--line-2); color: var(--ink-2);
  font-size: 11px; padding: 2px 7px; border-radius: 20px; white-space: nowrap;
  box-shadow: var(--shadow-s); backdrop-filter: blur(3px);
}
.part-label.is-selected { background: var(--accent); color: #fff; border-color: var(--accent); }

.toolbar {
  position: absolute; top: 12px; left: 12px; right: 12px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; pointer-events: none;
}
.tool-group {
  display: flex; align-items: center; gap: 4px; pointer-events: auto;
  background: rgba(255,255,255,.94); border: 1px solid var(--line);
  border-radius: 10px; padding: 4px; box-shadow: var(--shadow-s); backdrop-filter: blur(6px);
}
.tool-group > label.grp-label {
  font-size: 11px; color: var(--muted); padding: 0 6px 0 4px; white-space: nowrap;
}
.tool-btn {
  border: 0; background: transparent; font: inherit; font-size: 12.5px; color: var(--ink-2);
  padding: 6px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap; transition: .12s;
  display: inline-flex; align-items: center; gap: 5px;
}
.tool-btn:hover { background: var(--bg-soft2); }
.tool-btn.active { background: var(--accent); color: #fff; }
.tool-btn.active.mode-xray { background: var(--teal); }
.tool-btn.active.mode-section { background: var(--violet); }
.tool-btn.active.mode-explode { background: var(--amber); }
.tool-btn .ico { font-size: 13px; line-height: 1; }

.slider-group {
  position: absolute; left: 12px; bottom: 12px; pointer-events: auto;
  background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; box-shadow: var(--shadow-s); display: none; min-width: 260px;
}
.slider-group.show { display: block; }
.slider-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.slider-row:first-child { margin-top: 0; }
.slider-row label { font-size: 11.5px; color: var(--muted); width: 74px; flex: none; }
.slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
.slider-row .val { font-size: 11.5px; color: var(--ink-2); width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
.seg { display: flex; gap: 2px; background: var(--bg-soft); border-radius: 7px; padding: 2px; }
.seg button {
  border: 0; background: none; font: inherit; font-size: 11.5px; color: var(--ink-2);
  padding: 4px 9px; border-radius: 5px; cursor: pointer;
}
.seg button.active { background: var(--violet); color: #fff; }

.view-presets {
  position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; pointer-events: auto;
  background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 10px;
  padding: 4px; box-shadow: var(--shadow-s);
}

.legend {
  position: absolute; right: 12px; top: 64px; pointer-events: auto;
  background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 11px; box-shadow: var(--shadow-s); font-size: 11px; color: var(--ink-2);
  max-width: 190px;
}
.legend h4 { margin: 0 0 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.legend div { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }

/* ---------- info panel ---------- */
.info-body { padding: 14px; }
.info-empty { color: var(--muted); font-size: 13px; line-height: 1.7; padding: 26px 16px; text-align: center; }
.info-empty .big { font-size: 34px; display: block; margin-bottom: 10px; opacity: .35; }
.info-title { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
.info-title .swatch { width: 14px; height: 14px; margin-top: 4px; }
.info-title h3 { margin: 0; font-size: 17px; line-height: 1.35; font-weight: 650; }
.info-group-tag {
  display: inline-block; font-size: 11px; color: var(--accent); background: var(--accent-soft);
  padding: 3px 9px; border-radius: 20px; margin: 6px 0 14px;
}
.info-actions { display: flex; gap: 6px; margin-bottom: 14px; }
.info-actions button {
  flex: 1; border: 1px solid var(--line-2); background: #fff; font: inherit; font-size: 12px;
  padding: 7px 8px; border-radius: 8px; cursor: pointer; color: var(--ink-2); transition: .12s;
}
.info-actions button:hover { background: var(--bg-soft); border-color: var(--accent); color: var(--accent); }
.info-actions button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.info-section { margin-bottom: 15px; }
.info-section h4 {
  margin: 0 0 5px; font-size: 11px; letter-spacing: .5px; text-transform: uppercase;
  color: var(--muted); display: flex; align-items: center; gap: 6px;
}
.info-section h4::before { content: ""; width: 3px; height: 12px; border-radius: 2px; background: var(--accent); }
.info-section.principle h4::before { background: var(--teal); }
.info-section.spec h4::before { background: var(--amber); }
.info-section.risk h4::before { background: var(--rose); }
.info-section p { margin: 0; font-size: 13px; line-height: 1.78; color: var(--ink-2); }
.info-section.spec p, .info-section.risk p {
  background: var(--bg-soft); border-radius: 9px; padding: 9px 11px; font-size: 12.5px;
}

/* ---------- chamber process controls ---------- */
.proc-bar {
  position: absolute; left: 12px; right: 12px; bottom: 12px; pointer-events: auto;
  background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow-m); padding: 10px 12px;
}
.proc-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.proc-btn {
  border: 0; background: var(--accent); color: #fff; font: inherit; font-size: 13px;
  padding: 8px 15px; border-radius: 8px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.proc-btn.ghost { background: var(--bg-soft); color: var(--ink-2); }
.proc-btn:hover { filter: brightness(1.06); }
.proc-readout { display: flex; gap: 16px; margin-left: auto; font-size: 12px; color: var(--muted); }
.proc-readout b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 650; }
.proc-steps { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
.proc-step {
  border: 1px solid var(--line-2); background: #fff; font: inherit; font-size: 11.5px;
  color: var(--ink-2); padding: 6px 10px; border-radius: 20px; cursor: pointer; white-space: nowrap;
  transition: .12s; flex: none;
}
.proc-step:hover { border-color: var(--accent); color: var(--accent); }
.proc-step.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.proc-progress { height: 3px; background: var(--bg-soft2); border-radius: 3px; margin-top: 9px; overflow: hidden; }
.proc-progress i { display: block; height: 100%; background: linear-gradient(90deg, #1f6feb, #00a396); width: 0; }

/* ---------- flow tab ---------- */
.doc-wrap { height: 100%; overflow-y: auto; background: var(--bg-soft); }
.doc { max-width: 1040px; margin: 0 auto; padding: 28px 22px 60px; }
.doc h2 { margin: 0 0 4px; font-size: 22px; }
.doc .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; }
.flow-card {
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow-s);
  display: grid; grid-template-columns: 54px 1fr; gap: 16px;
}
.flow-idx {
  width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center;
  font-size: 17px; font-weight: 700; color: #fff; background: var(--accent);
}
.flow-card h3 { margin: 0 0 4px; font-size: 15.5px; }
.flow-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
.chip {
  font-size: 11.5px; padding: 3px 10px; border-radius: 20px; background: var(--bg-soft);
  color: var(--ink-2); border: 1px solid var(--line);
}
.chip.rpm { background: #fff5e8; border-color: #ffd9a8; color: #a35a00; }
.chip.chem { background: #eef4ff; border-color: #c9dcff; color: #1f4fa8; }
.chip.time { background: #eefaf5; border-color: #bfe8d6; color: #12724b; }
.flow-card p { margin: 0; font-size: 13.2px; line-height: 1.8; color: var(--ink-2); }
.flow-purpose { font-weight: 600; color: var(--ink); margin-bottom: 6px !important; }

/* ---------- quiz ---------- */
.quiz-q { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow-s); }
.quiz-q h3 { margin: 0 0 10px; font-size: 14.5px; line-height: 1.6; }
.quiz-opt { display: flex; align-items: flex-start; gap: 9px; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: 13px; line-height: 1.6; color: var(--ink-2); }
.quiz-opt:hover { background: var(--bg-soft); }
.quiz-opt input { margin-top: 3px; accent-color: var(--accent); }
.quiz-opt.correct { background: #e9f9f0; color: #0f6b3f; }
.quiz-opt.wrong { background: #fdecee; color: #a3283a; }
.quiz-explain { margin-top: 10px; font-size: 12.5px; line-height: 1.75; color: var(--ink-2); background: var(--bg-soft); border-radius: 9px; padding: 10px 12px; display: none; }
.quiz-explain.show { display: block; }
.quiz-actions { display: flex; gap: 8px; align-items: center; margin: 4px 0 24px; }
.quiz-score { font-size: 14px; font-weight: 650; margin-left: auto; }

/* ---------- misc ---------- */
.disclaimer {
  font-size: 11.5px; color: var(--muted); line-height: 1.7; background: var(--bg-soft);
  border: 1px solid var(--line); border-left: 3px solid var(--amber);
  border-radius: 8px; padding: 9px 11px; margin: 14px;
}
.loading {
  position: absolute; inset: 0; display: grid; place-items: center; background: #fff;
  color: var(--muted); font-size: 13px; z-index: 5; transition: opacity .4s; 
}
.loading.hide { opacity: 0; pointer-events: none; }
.spinner {
  width: 26px; height: 26px; border: 3px solid var(--line-2); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.panel-left::-webkit-scrollbar, .panel-right::-webkit-scrollbar, .doc-wrap::-webkit-scrollbar,
.proc-steps::-webkit-scrollbar { width: 9px; height: 7px; }
.panel-left::-webkit-scrollbar-thumb, .panel-right::-webkit-scrollbar-thumb,
.doc-wrap::-webkit-scrollbar-thumb, .proc-steps::-webkit-scrollbar-thumb {
  background: #cfd9e4; border-radius: 6px; border: 2px solid #fff;
}

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .workspace { grid-template-columns: 240px minmax(0, 1fr) 300px; }
  .legend { display: none; }
}
@media (max-width: 900px) {
  body { overflow: auto; height: auto; }
  main { position: static; }
  .tabpanel { position: static; display: none; }
  .tabpanel.active { display: block; }
  /* 3D view first, then the description, then the component list */
  .workspace { grid-template-columns: 1fr; height: auto; display: flex; flex-direction: column; }
  .viewport { order: 1; height: auto; display: flex; flex-direction: column; }
  .canvas-host { position: relative; inset: auto; order: 2; height: 56vh; min-height: 330px; }
  .toolbar { order: 1; }
  .slider-group.show { order: 3; }
  .view-presets { order: 4; }
  .proc-bar { order: 5; }
  .panel-right { order: 2; border: 0; border-top: 1px solid var(--line); }
  .panel-left { order: 3; border: 0; border-top: 1px solid var(--line); max-height: 340px; }
  .toolbar { position: static; padding: 8px; background: var(--bg-soft); border-bottom: 1px solid var(--line); }
  .tool-group { background: #fff; }
  .slider-group, .view-presets { position: static; margin: 8px; box-shadow: none; }
  .proc-bar { position: static; margin: 0; border-radius: 0; box-shadow: none; border-left: 0; border-right: 0; }
  .brand-text h1 { font-size: 13px; }
  .brand-text p { display: none; }
  .lang-switch button { padding: 6px 9px; white-space: nowrap; }
  .app-header { padding: 8px 12px; gap: 8px; }
  .info-body { padding: 12px; }
  .doc { padding: 18px 14px 40px; }
  .flow-card { grid-template-columns: 40px 1fr; gap: 12px; padding: 14px; }
  .flow-idx { width: 36px; height: 36px; font-size: 15px; }
}
</style>

<body>

<header class="app-header">
  <div class="brand">
    <div class="brand-mark">SU<br>3200</div>
    <div class="brand-text">
      <h1 data-i18n="app.title">SCREEN DNS SU-3200 WET 單片式清洗機台訓練系統</h1>
      <p data-i18n="app.subtitle">半導體濕製程設備 · 3D 互動教材</p>
    </div>
  </div>
  <div class="header-spacer"></div>
  <div class="lang-switch" id="langSwitch"></div>
</header>

<nav class="tabbar" id="tabbar">
  <button data-tab="overview" class="active" data-i18n="tab.overview">整機總覽</button>
  <button data-tab="chamber" data-i18n="tab.chamber">腔室細部</button>
  <button data-tab="flow" data-i18n="tab.flow">製程流程</button>
  <button data-tab="quiz" data-i18n="tab.quiz">學習檢核</button>
</nav>

<main>
  <!-- ================= TAB 1: full tool ================= -->
  <section class="tabpanel active" id="tab-overview">
    <div class="workspace">
      <aside class="panel-left">
        <div class="panel-head">
          <h2 data-i18n="list.title">零件清單</h2>
          <input class="search-box" id="searchTool" type="search" data-i18n-ph="list.search" placeholder="搜尋零件…">
          <p class="panel-hint" data-i18n="list.hint">點擊零件名稱或 3D 模型可查看說明</p>
        </div>
        <div class="part-groups" id="listTool"></div>
      </aside>

      <div class="viewport" id="viewTool">
        <div class="canvas-host" id="canvasTool"></div>
        <div class="loading" id="loadTool"><div><div class="spinner"></div><span data-i18n="loading">載入 3D 模型中…</span></div></div>
        <div class="toolbar">
          <div class="tool-group">
            <label class="grp-label" data-i18n="view.title">檢視模式</label>
            <button class="tool-btn active" data-mode="solid" data-i18n="view.solid">實體</button>
            <button class="tool-btn mode-xray" data-mode="xray"><span class="ico">◍</span><span data-i18n="view.xray">外殼透視</span></button>
            <button class="tool-btn mode-section" data-mode="section"><span class="ico">◧</span><span data-i18n="view.section">剖面圖</span></button>
            <button class="tool-btn mode-explode" data-mode="explode"><span class="ico">✳</span><span data-i18n="view.explode">爆炸圖</span></button>
          </div>
          <div class="tool-group">
            <button class="tool-btn" data-act="labels"><span class="ico">🏷</span><span data-i18n="view.labels">顯示標籤</span></button>
            <button class="tool-btn" data-act="autorotate"><span class="ico">⟳</span><span data-i18n="view.autorotate">自動旋轉</span></button>
            <button class="tool-btn" data-act="reset"><span class="ico">⌂</span><span data-i18n="view.reset">重設視角</span></button>
          </div>
        </div>

        <div class="legend">
          <h4 data-i18n="legend.title">顏色圖例</h4>
          <div><i style="background:#00b8a9"></i><span data-i18n="group.process">製程單元</span></div>
          <div><i style="background:#f2c94c"></i><span data-i18n="group.transfer">搬送系統</span></div>
          <div><i style="background:#2d9cdb"></i><span data-i18n="group.fluid">流體 / 藥液系統</span></div>
          <div><i style="background:#9aa5b1"></i><span data-i18n="group.utility">廠務 / 排氣系統</span></div>
          <div><i style="background:#34495e"></i><span data-i18n="group.control">控制與安全</span></div>
        </div>

        <div class="slider-group" id="slidersTool">
          <div class="slider-row" data-for="explode">
            <label data-i18n="ctrl.explodeAmount">爆炸距離</label>
            <input type="range" min="0" max="100" value="0" data-slider="explode">
            <span class="val">0%</span>
          </div>
          <div class="slider-row" data-for="xray">
            <label data-i18n="ctrl.opacity">外殼透明度</label>
            <input type="range" min="2" max="60" value="14" data-slider="opacity">
            <span class="val">14%</span>
          </div>
          <div class="slider-row" data-for="section">
            <label data-i18n="ctrl.sectionAxis">剖切軸向</label>
            <div class="seg" data-seg="axis">
              <button data-axis="x" class="active">X</button>
              <button data-axis="y">Y</button>
              <button data-axis="z">Z</button>
            </div>
            <button class="tool-btn" data-act="flip" data-i18n="ctrl.sectionFlip">反向剖切</button>
          </div>
          <div class="slider-row" data-for="section">
            <label data-i18n="ctrl.sectionPos">剖切位置</label>
            <input type="range" min="-100" max="100" value="0" data-slider="section">
            <span class="val">0</span>
          </div>
        </div>

        <div class="view-presets">
          <button class="tool-btn" data-view="iso" data-i18n="view.iso">立體</button>
          <button class="tool-btn" data-view="front" data-i18n="view.front">前視</button>
          <button class="tool-btn" data-view="side" data-i18n="view.side">側視</button>
          <button class="tool-btn" data-view="top" data-i18n="view.top">俯視</button>
        </div>
      </div>

      <aside class="panel-right">
        <div class="panel-head"><h2 data-i18n="info.select">請點選一個零件</h2></div>
        <div class="info-body" id="infoTool"></div>
        <p class="disclaimer" data-i18n="app.disclaimer"></p>
      </aside>
    </div>
  </section>

  <!-- ================= TAB 2: single chamber ================= -->
  <section class="tabpanel" id="tab-chamber">
    <div class="workspace">
      <aside class="panel-left">
        <div class="panel-head">
          <h2 data-i18n="chamber.title">製程腔室細部</h2>
          <input class="search-box" id="searchCh" type="search" data-i18n-ph="list.search" placeholder="搜尋零件…">
          <p class="panel-hint" data-i18n="chamber.hint"></p>
        </div>
        <div class="part-groups" id="listCh"></div>
      </aside>

      <div class="viewport" id="viewCh">
        <div class="canvas-host" id="canvasCh"></div>
        <div class="loading" id="loadCh"><div><div class="spinner"></div><span data-i18n="loading">載入 3D 模型中…</span></div></div>
        <div class="toolbar">
          <div class="tool-group">
            <label class="grp-label" data-i18n="view.title">檢視模式</label>
            <button class="tool-btn active" data-mode="solid" data-i18n="view.solid">實體</button>
            <button class="tool-btn mode-xray" data-mode="xray"><span class="ico">◍</span><span data-i18n="view.xray">外殼透視</span></button>
            <button class="tool-btn mode-section" data-mode="section"><span class="ico">◧</span><span data-i18n="view.section">剖面圖</span></button>
            <button class="tool-btn mode-explode" data-mode="explode"><span class="ico">✳</span><span data-i18n="view.explode">爆炸圖</span></button>
          </div>
          <div class="tool-group">
            <button class="tool-btn" data-act="labels"><span class="ico">🏷</span><span data-i18n="view.labels">顯示標籤</span></button>
            <button class="tool-btn" data-act="autorotate"><span class="ico">⟳</span><span data-i18n="view.autorotate">自動旋轉</span></button>
            <button class="tool-btn" data-act="reset"><span class="ico">⌂</span><span data-i18n="view.reset">重設視角</span></button>
          </div>
        </div>

        <div class="slider-group" id="slidersCh">
          <div class="slider-row" data-for="explode">
            <label data-i18n="ctrl.explodeAmount">爆炸距離</label>
            <input type="range" min="0" max="100" value="0" data-slider="explode">
            <span class="val">0%</span>
          </div>
          <div class="slider-row" data-for="xray">
            <label data-i18n="ctrl.opacity">外殼透明度</label>
            <input type="range" min="2" max="60" value="14" data-slider="opacity">
            <span class="val">14%</span>
          </div>
          <div class="slider-row" data-for="section">
            <label data-i18n="ctrl.sectionAxis">剖切軸向</label>
            <div class="seg" data-seg="axis">
              <button data-axis="x" class="active">X</button>
              <button data-axis="y">Y</button>
              <button data-axis="z">Z</button>
            </div>
            <button class="tool-btn" data-act="flip" data-i18n="ctrl.sectionFlip">反向剖切</button>
          </div>
          <div class="slider-row" data-for="section">
            <label data-i18n="ctrl.sectionPos">剖切位置</label>
            <input type="range" min="-100" max="100" value="0" data-slider="section">
            <span class="val">0</span>
          </div>
        </div>

        <div class="proc-bar">
          <div class="proc-top">
            <button class="proc-btn" id="procPlay"><span class="ico">▶</span><span data-i18n="chamber.play">播放製程流程</span></button>
            <button class="proc-btn ghost" id="procPrev" data-i18n="chamber.prev">上一步</button>
            <button class="proc-btn ghost" id="procNext" data-i18n="chamber.next">下一步</button>
            <div class="proc-readout">
              <span><span data-i18n="chamber.rpm">轉速</span>: <b id="rdRpm">0</b> rpm</span>
              <span><span data-i18n="chamber.chem">供液</span>: <b id="rdChem">—</b></span>
            </div>
          </div>
          <div class="proc-steps" id="procSteps"></div>
          <div class="proc-progress"><i id="procProgress"></i></div>
        </div>
      </div>

      <aside class="panel-right">
        <div class="panel-head"><h2 data-i18n="info.select">請點選一個零件</h2></div>
        <div class="info-body" id="infoCh"></div>
      </aside>
    </div>
  </section>

  <!-- ================= TAB 3: process flow ================= -->
  <section class="tabpanel" id="tab-flow">
    <div class="doc-wrap"><div class="doc">
      <h2 data-i18n="flow.title">製程流程 (Recipe Sequence)</h2>
      <p class="sub" data-i18n="flow.subtitle">典型 SC-1 / SC-2 / DHF 前清洗配方</p>
      <div id="flowList"></div>
      <p class="disclaimer" data-i18n="app.disclaimer" style="margin-left:0;margin-right:0"></p>
    </div></div>
  </section>

  <!-- ================= TAB 4: quiz ================= -->
  <section class="tabpanel" id="tab-quiz">
    <div class="doc-wrap"><div class="doc">
      <h2 data-i18n="quiz.title">學習檢核</h2>
      <p class="sub" data-i18n="quiz.hint"></p>
      <div id="quizList"></div>
      <div class="quiz-actions">
        <button class="proc-btn" id="quizCheck" data-i18n="quiz.check">對答案</button>
        <button class="proc-btn ghost" id="quizReset" data-i18n="quiz.reset">重做</button>
        <span class="quiz-score" id="quizScore"></span>
      </div>
    </div></div>
  </section>
</main>

  constructor(container, opts = {}) {
    this.container = container;
    this.opts = opts;
    this.parts = new Map();          // partId -> { objects: [], meshes: [] }
    this.selected = null;
    this.hovered = null;
    this.isolated = false;
    this.labelsOn = false;
    this.explodeAmount = 0;
    this.clipEnabled = false;
    this.clipAxis = 'x';
    this.clipPos = 0;
    this.clipFlip = false;
    this.xray = false;
    this.xrayOpacity = 0.14;
    this.active = opts.active !== false;   // hidden tabs stop rendering
    // the full-tool view is static, so it renders on demand instead of
    // burning a core at 60 fps; the animated chamber sets alwaysRender
    this.alwaysRender = !!opts.alwaysRender;
    this._dirty = true;
    this.onSelect = opts.onSelect || (() => {});
    this.onFrame = opts.onFrame || (() => {});
    this.labelText = opts.labelText || (id => id);

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0xffffff);

    const w = container.clientWidth || 800;
    const h = container.clientHeight || 600;
    this.camera = new THREE.PerspectiveCamera(42, w / h, 0.05, 100);
    this.camera.position.set(...(opts.camera || [4.2, 3.0, 5.2]));

    try { this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' }); } catch { this.renderer = new CanvasFallbackRenderer(); container.dataset.renderer='cpu'; }

    this.renderer.localClippingEnabled = true;
    this.renderer.shadowMap.enabled = false;
    container.appendChild(this.renderer.domElement);

    this.labelLayer = document.createElement('div');
    this.labelLayer.className = 'label-layer';
    container.appendChild(this.labelLayer);

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.08;
    this.controls.target.set(...(opts.target || [0, 1.0, 0]));
    this.controls.maxPolarAngle = Math.PI * 0.92;
    this.controls.minDistance = 0.4;
    this.controls.maxDistance = 30;

    this.scene.environmentIntensity = 0.55; }

    this._ground();

    this.raycaster = new THREE.Raycaster();
    this.pointer = new THREE.Vector2();
    this.clipPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);

    this._bindEvents();
    this.clock = new THREE.Clock();
    this._tween = null;
    this._loop();
  }

  _lights() {

    const key = new THREE.DirectionalLight(0xffffff, 1.25);
    key.position.set(5, 8, 6);
    this.scene.add(key);
    const fill = new THREE.DirectionalLight(0xdce8ff, 0.7);
    fill.position.set(-6, 4, -4);
    this.scene.add(fill);
    const rim = new THREE.DirectionalLight(0xfff0e0, 0.5);
    rim.position.set(0, 3, -8);
    this.scene.add(rim);
    this.scene.add(new THREE.AmbientLight(0xffffff, 0.25));
  }

  _ground() {

      this.opts.gridSize || 14, this.opts.gridDiv || 28, 0xc3cedb, 0xe6ecf3

    grid.material.transparent = true;
    grid.material.opacity = 0.75;
    grid.position.y = this.opts.gridY ?? 0;
    this.scene.add(grid);
    this.grid = grid;

    this.model = root;
    this.scene.add(root);

  _bindEvents() {

const THREE=M["assets/vendor/three.module.min.js"];

// Materials are DoubleSide so cross-section clipping still shows solid walls.
function mat(color, o = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    metalness: o.metalness ?? 0.25,
    roughness: o.roughness ?? 0.5,
    side: THREE.DoubleSide,
    transparent: !!o.transparent,
    opacity: o.opacity ?? 1,
    emissive: new THREE.Color(0x000000)
  });
}

function box(w, h, d, color, o = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, o));
  m.position.set(o.x || 0, o.y || 0, o.z || 0);
  return m;
}

function cyl(rTop, rBot, h, color, o = {}) {
  const m = new THREE.Mesh(
    new THREE.CylinderGeometry(rTop, rBot, h, o.seg || 28, 1, !!o.open),
    mat(color, o)
  );
  m.position.set(o.x || 0, o.y || 0, o.z || 0);
  if (o.rx) m.rotation.x = o.rx;
  if (o.rz) m.rotation.z = o.rz;
  return m;
}

function tube(points, radius, color, o = {}) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const m = new THREE.Mesh(
    new THREE.TubeGeometry(curve, Math.max(16, points.length * 8), radius, 10, false),
    mat(color, o)
  );
  return m;
}

function torus(r, tubeR, color, o = {}) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tubeR, 10, o.seg || 36), mat(color, o));
  m.position.set(o.x || 0, o.y || 0, o.z || 0);
  m.rotation.x = o.rx ?? Math.PI / 2;
  return m;
}

// Lathe profile helper: pts = [[radius, y], ...]
function lathe(pts, color, o = {}) {
  const v = pts.map(p => new THREE.Vector2(p[0], p[1]));
  const m = new THREE.Mesh(new THREE.LatheGeometry(v, o.seg || 48), mat(color, o));
  m.position.set(o.x || 0, o.y || 0, o.z || 0);
  return m;
}

// A part group: everything registered under one partId is selectable as a unit.
function part(id, opts = {}) {
  const g = new THREE.Group();
  g.name = id;
  g.userData.partId = id;
  g.userData.shell = !!opts.shell;
  if (opts.explode) g.userData.explodeDir = new THREE.Vector3(...opts.explode);
  return g;

// Mark every mesh under a group so raycasting can resolve the owning part.
function tagPart(group, refs) {
  const id = group.userData.partId;
  if (refs) Object.assign(group.userData, refs);
  group.traverse(o => {
    if (o.isMesh) {
      o.userData.partId = id;
      o.userData.shell = group.userData.shell || o.userData.shell;
      o.userData.baseColor = o.material.color.getHex();
      o.userData.baseOpacity = o.material.opacity;
      o.userData.baseTransparent = o.material.transparent;
    }
  });
  return group;
}

function addAll(parent, ...children) {
  children.forEach(c => parent.add(c));
  return parent;
}

// Repeated small bolts / holes without a mesh per item.
function instanced(geo, color, transforms, o = {}) {
  const m = new THREE.InstancedMesh(geo, mat(color, o), transforms.length);
  const dummy = new THREE.Object3D();
  transforms.forEach((t, i) => {
    dummy.position.set(t[0], t[1], t[2]);
    if (t[3]) dummy.rotation.set(t[3], t[4] || 0, t[5] || 0);
    else dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    m.setMatrixAt(i, dummy.matrix);
  });
  m.instanceMatrix.needsUpdate = true;
  return m;
}

return {mat,box,cyl,tube,torus,lathe,part,tagPart,addAll,instanced};
})();

    { pts: [[0.30, 0.00], [0.32, 0.10], [0.37, 0.26], [0.39, 0.36], [0.36, 0.43], [0.35, 0.44]], c: 0x5d9ec9 },
    { pts: [[0.40, 0.00], [0.42, 0.12], [0.46, 0.28], [0.48, 0.38], [0.45, 0.46], [0.44, 0.47]], c: 0x4489bd }
  ];
  profiles.forEach((p, i) => {
    const m = lathe(p.pts, p.c, { y: 0.30, seg: 56, transparent: true, opacity: 0.42, roughness: 0.2 });
    m.userData.shell = true;   // x-ray mode looks straight through the cup
    movable.add(m);
  });
  // collection gutters at the bottom of each baffle
  [0.25, 0.345, 0.44].forEach((r, i) => {
    movable.add(torus(r, 0.022, [0x27ae60, 0x2f80ed, 0xf2994a][i], { y: 0.31 }));
  });
  g.add(movable);
  return tagPart(g, { movable });
}

function cupBase() {
  const g = part('cup_base', { explode: [0, -0.9, 0] });
  g.add(cyl(0.5, 0.52, 0.1, 0x6b7a8f, { y: 0.15, metalness: 0.45 }));
  g.add(torus(0.46, 0.02, 0x54606f, { y: 0.21 }));
  // guide rods + elevation cylinders
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2 + 0.9;
    const x = Math.cos(a) * 0.42, z = Math.sin(a) * 0.42;
    g.add(cyl(0.016, 0.016, 0.42, 0xbdc3c7, { x, y: 0.38, z, metalness: 0.9, roughness: 0.15 }));
    g.add(cyl(0.032, 0.032, 0.12, 0x34495e, { x, y: 0.22, z, metalness: 0.6 }));
  }
  // in-position proximity switches
  [0.2, 0.32, 0.44].forEach((y, i) => g.add(box(0.03, 0.02, 0.03, 0x00e676, { x: 0.46, y: y + 0.1, z: 0.12 })));
  return tagPart(g);
}

function drainPorts() {
  const g = part('drain_ports', { explode: [-0.9, -0.5, 0] });
  const colors = [0x27ae60, 0x2f80ed, 0xf2994a]; // reclaim / alkaline / acid
  colors.forEach((c, i) => {
    const a = Math.PI * (0.75 + i * 0.22);
    const x = Math.cos(a) * 0.45, z = Math.sin(a) * 0.45;
    g.add(tube([[x, 0.14, z], [x * 1.4, 0.06, z * 1.4], [x * 1.9, -0.05, z * 1.9]], 0.032, c));
    g.add(cyl(0.05, 0.05, 0.06, 0x546e7a, { x: x * 1.45, y: 0.04, z: z * 1.45, metalness: 0.6 }));
    // segregation valve actuator
    g.add(box(0.06, 0.07, 0.06, 0x37474f, { x: x * 1.7, y: 0.06, z: z * 1.7 }));
  });
  return tagPart(g);
}

function exhaustPort() {
  const g = part('exhaust_port', { explode: [0, -0.3, -1.0] });
  g.add(tube([[0, 0.2, -0.45], [0, 0.16, -0.62], [0, 0.1, -0.8]], 0.075, 0x9aa5b1));
  g.add(cyl(0.1, 0.1, 0.08, 0x607d8b, { y: 0.14, z: -0.72, rx: Math.PI / 2.4, metalness: 0.6 }));
  // damper blade + position indicator
  g.add(box(0.13, 0.01, 0.13, 0xffc107, { y: 0.14, z: -0.72, rx: 0.6 }));
  g.add(box(0.04, 0.05, 0.04, 0xff6f00, { x: 0.11, y: 0.17, z: -0.72 }));
  // gas/liquid separation baffle inside the cup base
  g.add(torus(0.47, 0.012, 0x90a4ae, { y: 0.12 }));
  return tagPart(g);
}

function topPlate() {
  const g = part('top_plate', { explode: [0, 1.0, 0] });
  g.add(cyl(0.46, 0.46, 0.022, 0xa0d8ef, { y: 1.2, seg: 48, transparent: true, opacity: 0.9 }));
  // perforation pattern
  const holes = [];
  for (let r = 0.06; r <= 0.42; r += 0.06) {
    const n = Math.max(6, Math.round(r * 90));
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      holes.push([Math.cos(a) * r, 1.2, Math.sin(a) * r]);
    }
  }
  g.add(instanced(new THREE.CylinderGeometry(0.008, 0.008, 0.026, 6), 0x5b9bd5, holes));
  // N2 plenum above it
  g.add(cyl(0.48, 0.44, 0.1, 0xcfe8f7, { y: 1.27, transparent: true, opacity: 0.4 }));
  g.add(cyl(0.035, 0.035, 0.12, 0x27ae60, { x: 0.3, y: 1.36, metalness: 0.6 }));
  return tagPart(g);
}

function swingArm(id, opts) {
  // Pivot sits on a radius outside the cup; at armAngle = 0 the nozzle is over
  // the wafer center, and the home angle swings it out over its standby pot.
  const g = part(id, { explode: opts.explode });
  const px = opts.px, pz = opts.pz, py = opts.py;
  const len = Math.hypot(px, pz);

  // support column + rotary actuator
  g.add(cyl(0.028, 0.032, 0.46, 0x9fb1c0, { x: px, y: py - 0.23, z: pz, metalness: 0.55 }));
  g.add(cyl(0.05, 0.05, 0.07, 0x6b7f91, { x: px, y: py - 0.46, z: pz, metalness: 0.65 }));
  g.add(cyl(0.05, 0.05, 0.05, opts.color, { x: px, y: py + 0.02, z: pz, metalness: 0.4 }));

  const holder = new THREE.Group();
  holder.position.set(px, 0, pz);
  holder.rotation.y = -Math.atan2(pz, px);

  const arm = new THREE.Group();
  arm.add(box(len, 0.038, 0.055, opts.color, { x: -len / 2, y: py, metalness: 0.3, roughness: 0.4 }));
  arm.add(box(len * 0.9, 0.012, 0.02, opts.colorDark || opts.color, { x: -len / 2, y: py + 0.025 }));
  arm.add(tube([[0, py + 0.045, 0], [-len * 0.5, py + 0.075, 0], [-len, py + 0.02, 0]], 0.009, opts.nozzleColor));

  const head = new THREE.Group();
  head.position.set(-len, py, 0);
  head.add(box(0.055, 0.045, 0.05, opts.nozzleColor, { y: 0.005 }));
  head.add(cyl(0.022, 0.015, 0.075, opts.nozzleColor, { y: -0.05 }));
  if (opts.second) head.add(cyl(0.015, 0.011, 0.065, opts.second, { x: 0.045, y: -0.045 }));
  if (opts.transducer) head.add(box(0.09, 0.05, 0.06, opts.transducer, { x: 0.075, y: 0.03 }));
  arm.add(head);

  arm.rotation.y = opts.home;
  holder.add(arm);
  g.add(holder);

  // resolve where the nozzle sits at the home angle -> that is the standby pot
  g.updateMatrixWorld(true);
  const tip = new THREE.Vector3(0, -0.06, 0);
  head.localToWorld(tip);

  tagPart(g, { arm, head, tipY: py });
  g.userData.potPos = tip;
  return g;
}

function standbyPots(positions) {
  const g = part('nozzle_standby', { explode: [0.3, -0.3, 0.9] });
  positions.forEach(p => {
    g.add(cyl(0.062, 0.055, 0.1, 0x6fcf97, { x: p.x, y: p.y - 0.07, z: p.z, open: true }));
    g.add(cyl(0.05, 0.05, 0.02, 0x2ecc71, { x: p.x, y: p.y - 0.1, z: p.z, transparent: true, opacity: 0.75 }));
    // drain leg back to the cup base
    g.add(cyl(0.014, 0.014, 0.2, 0x27ae60, { x: p.x, y: p.y - 0.22, z: p.z }));
    g.add(box(0.05, 0.03, 0.05, 0x1e8449, { x: p.x, y: p.y - 0.33, z: p.z }));
  });
  return tagPart(g);
}

function sensors() {
  const g = part('ch_sensors', { explode: [-1.0, 0.2, -0.5] });
  // flow meters on the inlet lines
  [[-0.5, 1.0], [-0.5, 0.88], [-0.5, 0.76]].forEach(([x, y], i) => {
    g.add(cyl(0.028, 0.028, 0.1, [0x2f80ed, 0x56ccf2, 0xbb6bd9][i], { x, y, z: -0.45, rz: Math.PI / 2, metalness: 0.5 }));
    g.add(box(0.05, 0.05, 0.03, 0xe74c3c, { x, y: y + 0.045, z: -0.45 }));
  });
  // outlet thermocouple
  g.add(cyl(0.012, 0.012, 0.12, 0xe74c3c, { x: -0.36, y: 0.98, z: -0.45 }));
  // drain clog / level probe
  g.add(cyl(0.01, 0.01, 0.3, 0xff7043, { x: -0.4, y: 0.3, z: 0.25 }));
  // wafer-present optical sensor aimed across the chuck
  g.add(box(0.04, 0.04, 0.04, 0xff1744, { x: -0.3, y: 0.74, z: 0.4 }));
  g.add(box(0.04, 0.04, 0.04, 0xff1744, { x: 0.3, y: 0.74, z: 0.4 }));
  // signal junction box
  g.add(box(0.14, 0.18, 0.06, 0xb71c1c, { x: -0.52, y: 0.5, z: -0.45 }));
  return tagPart(g);
}

// --- liquid effects -------------------------------------------------------
function liquidFx() {
  const grp = new THREE.Group();
  grp.userData.fx = true;

  const streamMat = new THREE.MeshStandardMaterial({
    color: 0x56ccf2, transparent: true, opacity: 0.9, roughness: 0.08, metalness: 0.05,
    emissive: new THREE.Color(0x27506b), emissiveIntensity: 0.5, side: THREE.DoubleSide
  });
  const stream = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.017, 1, 14), streamMat);
  stream.visible = false;
  grp.add(stream);

  const filmMat = new THREE.MeshStandardMaterial({
    color: 0x56ccf2, transparent: true, opacity: 0.6, roughness: 0.03,
    metalness: 0.15, side: THREE.DoubleSide
  });
  const film = new THREE.Mesh(new THREE.CylinderGeometry(WAFER_R, WAFER_R, 0.006, 56), filmMat);
  film.position.y = WAFER_Y + 0.006;
  film.visible = false;
  grp.add(film);

  const backStream = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.01, 0.03, 10), streamMat.clone());
  backStream.position.set(0, WAFER_Y - 0.02, 0);
  backStream.visible = false;
  grp.add(backStream);

  // throw-off droplets
  const N = 420;
  const pos = new Float32Array(N * 3);
  const vel = new Float32Array(N * 3);
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pMat = new THREE.PointsMaterial({ color: 0x56ccf2, size: 0.012, transparent: true, opacity: 0.85, depthWrite: false });
  const points = new THREE.Points(pGeo, pMat);
  points.visible = false;
  points.userData = { vel, alive: new Float32Array(N) };
  grp.add(points);

  return { grp, stream, film, backStream, points };
}

function buildChamber() {
  const root = new THREE.Group();
  root.name = 'chamber';

  const h = housing();
  const sh = shutter();
  const chuck = spinChuck();
  const pins = gripPins();
  const waf = wafer();
  const spin = spindle();
  const back = backNozzle();
  const lift = liftPins();
  const cup = cupAssembly();
  const cbase = cupBase();
  const drains = drainPorts();
  const exh = exhaustPort();
  const top = topPlate();
  const R = 0.55, PY = 0.92;
  const at = deg => ({ px: Math.cos(deg * Math.PI / 180) * R, pz: Math.sin(deg * Math.PI / 180) * R });
  const SWING = 1.154;   // swings the nozzle clear of the wafer, over its pot

  const chemArm = swingArm('chem_arm', {
    ...at(35), py: PY, color: 0x9b51e0, colorDark: 0x6c3483, nozzleColor: 0xbb6bd9,
    home: -SWING, explode: [0.9, 0.5, 0.5]
  });
  const rinseArm = swingArm('rinse_arm', {
    ...at(145), py: PY, color: 0x27ae60, colorDark: 0x196f3d, nozzleColor: 0x56ccf2,
    second: 0xbb6bd9, home: SWING, explode: [-0.9, 0.5, 0.5]
  });
  const tfArm = swingArm('two_fluid_nozzle', {
    ...at(265), py: PY + 0.06, color: 0x00b8a9, colorDark: 0x00796b, nozzleColor: 0x26c6da,
    transducer: 0x00695c, home: -SWING, explode: [0.3, 0.6, -0.9]
  });

  // the chemical nozzle tip is its own selectable part, riding on the arm head
  const chemNozzle = part('chem_nozzle', { explode: [0.9, 0.8, 0.5] });
  chemNozzle.add(cyl(0.028, 0.018, 0.055, 0xd291f0, { y: -0.055 }));
  chemNozzle.add(torus(0.026, 0.006, 0x8e44ad, { y: -0.028 }));
  tagPart(chemNozzle);
  chemArm.userData.head.add(chemNozzle);

  const pots = standbyPots([chemArm.userData.potPos, rinseArm.userData.potPos, tfArm.userData.potPos]);
  const sens = sensors();

  const fx = liquidFx();

  [h, sh, chuck, pins, waf, spin, back, lift, cup, cbase, drains, exh, top,
    chemArm, rinseArm, tfArm, pots, sens].forEach(p => root.add(p));
  root.add(fx.grp);

  // chuck + grip pins + wafer + lift pins all turn with the spindle
  const refs = {
    rotor: [chuck, pins, waf, lift.userData.pins],
    wafer: waf,
    cup: cup.userData.movable,
    chemArm: chemArm.userData.arm,
    rinseArm: rinseArm.userData.arm,
    twoFluidArm: tfArm.userData.arm,
    chemHead: chemArm.userData.head,
    rinseHead: rinseArm.userData.head,
    tfHead: tfArm.userData.head,
    shutterDoor: sh.userData.door,
    liftPins: lift.userData.pins,
    swing: SWING,
    fx
  };
  return { root, refs, WAFER_R, WAFER_Y };
}

return {buildChamber};
})();
M["assets/js/app.js"]=(()=>{
const safeStorage={getItem:k=>{try{return localStorage.getItem(k)}catch{return null}},setItem:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const THREE=M["assets/vendor/three.module.min.js"];
const { UI, LANGS, t }=M["assets/js/i18n.js"];
const { TOOL_PARTS, CHAMBER_PARTS, PROCESS_STEPS }=M["assets/js/parts-data.js"];
const { QUIZ }=M["assets/js/quiz-data.js"];
const { Viewer }=M["assets/js/viewer.js"];
const { buildTool }=M["assets/js/model-tool.js"];
const { buildChamber }=M["assets/js/model-chamber.js"];

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

let lang = safeStorage.getItem('su3200.lang') || 'zh';
if (!UI[lang]) lang = 'zh';

const S = {
  tool: { viewer: null, parts: TOOL_PARTS, mode: 'solid', isolate: false, search: '' },
  ch: { viewer: null, parts: CHAMBER_PARTS, mode: 'solid', isolate: false, search: '' }
};
const byId = new Map([...TOOL_PARTS, ...CHAMBER_PARTS].map(p => [p.id, p]));

// ---------------------------------------------------------------- i18n -----
function applyI18n() {
  document.documentElement.lang = { zh: 'zh-Hant', en: 'en', ja: 'ja' }[lang];
  $$('[data-i18n]').forEach(el => { el.textContent = t(lang, el.dataset.i18n); });
  $$('[data-i18n-ph]').forEach(el => { el.placeholder = t(lang, el.dataset.i18nPh); });
  $$('#langSwitch button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  renderList('tool', '#listTool');
  renderList('ch', '#listCh');
  renderInfo('tool');
  renderInfo('ch');
  renderFlow();
  renderQuiz();
  renderProcSteps();
  updateProcReadout();
  ['tool', 'ch'].forEach(k => S[k].viewer && S[k].viewer.refreshLabelText());
  document.dispatchEvent(new CustomEvent('lang-changed'));
}

function buildLangSwitch() {
  const wrap = $('#langSwitch');
  wrap.innerHTML = '';
  LANGS.forEach(l => {
    const b = document.createElement('button');
    b.textContent = l.label;
    b.dataset.lang = l.code;
    b.addEventListener('click', () => {
      lang = l.code;
      safeStorage.setItem('su3200.lang', lang);
      applyI18n();
    });
    wrap.appendChild(b);
  });
}

const hex = n => '#' + n.toString(16).padStart(6, '0');

// ------------------------------------------------------------ part list ----
function renderList(key, sel) {
  const host = $(sel);
  if (!host) return;
  const q = S[key].search.trim().toLowerCase();
  const groups = new Map();
  S[key].parts.forEach(p => {
    const name = p[lang].name;
    if (q && !(name.toLowerCase().includes(q) || p.id.includes(q) || p[lang].fn.toLowerCase().includes(q))) return;
    if (!groups.has(p.group)) groups.set(p.group, []);
    groups.get(p.group).push(p);
  });
  host.innerHTML = '';
  if (!groups.size) {
    host.innerHTML = `<p class="panel-hint" style="padding:16px">${t(lang, 'list.empty')}</p>`;
    return;
  }
  groups.forEach((items, g) => {
    const h = document.createElement('div');
    h.className = 'group-title';
    h.textContent = t(lang, 'group.' + g);
    host.appendChild(h);
    items.forEach(p => {
      const b = document.createElement('button');
      b.className = 'part-item';
      b.dataset.id = p.id;
      b.innerHTML = `<i class="swatch" style="background:${hex(p.color)}"></i><span>${p[lang].name}</span>`;
      b.addEventListener('click', () => {
        const v = S[key].viewer;
        if (v) { v.select(p.id); v.focus(p.id); }
        else { S[key].pending = p.id; renderInfo(key); }
      });
      host.appendChild(b);
    });
  });
  markActive(key);
}

function markActive(key) {
  const sel = key === 'tool' ? '#listTool' : '#listCh';
  const cur = S[key].viewer ? S[key].viewer.selected : S[key].pending;
  $$(sel + ' .part-item').forEach(b => b.classList.toggle('active', b.dataset.id === cur));
}

// ----------------------------------------------------------- info panel ----
function renderInfo(key) {
  const host = $(key === 'tool' ? '#infoTool' : '#infoCh');
  if (!host) return;
  const id = S[key].viewer ? S[key].viewer.selected : S[key].pending;
  const p = id && byId.get(id);
  if (!p) {
    host.innerHTML = `<div class="info-empty"><span class="big">◎</span>${t(lang, 'info.selectHint')}</div>`;
    return;
  }
  const d = p[lang];
  host.innerHTML = `
    <div class="info-title">
      <i class="swatch" style="background:${hex(p.color)}"></i>
      <h3>${d.name}</h3>
    </div>
    <div class="info-group-tag">${t(lang, 'group.' + p.group)}</div>
    <div class="info-actions">
      <button data-info-act="focus">${t(lang, 'info.focus')}</button>
      <button data-info-act="isolate" class="${S[key].isolate ? 'active' : ''}">${S[key].isolate ? t(lang, 'info.isolateOff') : t(lang, 'info.isolate')}</button>
    </div>
    <div class="info-section"><h4>${t(lang, 'info.function')}</h4><p>${d.fn}</p></div>
    <div class="info-section principle"><h4>${t(lang, 'info.principle')}</h4><p>${d.pr}</p></div>
    <div class="info-section spec"><h4>${t(lang, 'info.spec')}</h4><p>${d.sp}</p></div>
    <div class="info-section risk"><h4>${t(lang, 'info.risk')}</h4><p>${d.rk}</p></div>`;
  host.querySelector('[data-info-act="focus"]').addEventListener('click', () => S[key].viewer && S[key].viewer.focus(id));
  host.querySelector('[data-info-act="isolate"]').addEventListener('click', () => {
    S[key].isolate = !S[key].isolate;
    S[key].viewer && S[key].viewer.applyIsolate(S[key].isolate);
    renderInfo(key);
  });
  markActive(key);
}

// -------------------------------------------------------------- viewers ----
function toolbarFor(key, viewportSel, sliderSel) {
  const root = $(viewportSel);
  const sliders = $(sliderSel);
  const st = S[key];

  const syncSliderRows = () => {
    const show = st.mode === 'explode' || st.mode === 'section' || st.mode === 'xray';
    sliders.classList.toggle('show', show);
    sliders.querySelectorAll('.slider-row').forEach(r => {
      r.style.display = r.dataset.for === st.mode ? 'flex' : 'none';
    });
  };

  root.querySelectorAll('[data-mode]').forEach(btn => {
    btn.addEventListener('click', () => {
      st.mode = btn.dataset.mode;
      root.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b === btn));
      const v = st.viewer;
      if (!v) return;
      v.applyXray(st.mode === 'xray');
      v.applySection(st.mode === 'section');
      if (st.mode !== 'explode') {
        v.applyExplode(0);
        const s = sliders.querySelector('[data-slider=explode]');
        s.value = 0; s.parentElement.querySelector('.val').textContent = '0%';
      } else {
        const s = sliders.querySelector('[data-slider=explode]');
        if (+s.value === 0) { s.value = 45; s.parentElement.querySelector('.val').textContent = '45%'; }
        v.applyExplode(+s.value / 100);
        setTimeout(() => v.fitAll(1.05), 30);
      }
      syncSliderRows();
    });
  });

  sliders.querySelectorAll('input[type=range]').forEach(inp => {
    inp.addEventListener('input', () => {
      const v = st.viewer;
      const out = inp.parentElement.querySelector('.val');
      const kind = inp.dataset.slider;
      if (kind === 'explode') { out.textContent = inp.value + '%'; v && v.applyExplode(+inp.value / 100); }
      if (kind === 'opacity') { out.textContent = inp.value + '%'; v && v.setXrayOpacity(+inp.value / 100); }
      if (kind === 'section') {
        out.textContent = inp.value;
        const span = key === 'tool' ? 4.5 : 1.4;
        v && v.applySection(true, v.clipAxis, (+inp.value / 100) * span, v.clipFlip);
      }
    });
  });

  sliders.querySelectorAll('[data-seg=axis] button').forEach(b => {
    b.addEventListener('click', () => {
      sliders.querySelectorAll('[data-seg=axis] button').forEach(x => x.classList.toggle('active', x === b));
      const v = st.viewer; if (!v) return;
      const pos = +sliders.querySelector('[data-slider=section]').value / 100 * (key === 'tool' ? 4.5 : 1.4);
      v.applySection(true, b.dataset.axis, pos, v.clipFlip);
    });
  });
  sliders.querySelector('[data-act=flip]').addEventListener('click', e => {
    const v = st.viewer; if (!v) return;

const lerp = (a, b, k) => a + (b - a) * Math.min(1, k);

function animateChamber(dt, built) {
  const step = PROCESS_STEPS[P.idx];
  const refs = built.refs;
  const { fx } = refs;

  if (P.playing) {
    P.t += dt;
    if (P.t >= step.duration) {
      P.t = 0;
      P.idx = (P.idx + 1) % PROCESS_STEPS.length;
      onStepChanged();
    }
  }
  const cur = PROCESS_STEPS[P.idx];

  // spindle ramp (rpm/s), then a damped visual rotation so it never strobes
  const ramp = 1400 * dt;
  P.rpm += THREE.MathUtils.clamp(cur.rpm - P.rpm, -ramp, ramp);
  P.angle += (P.rpm / 60) * Math.PI * 2 * dt * 0.09;
  refs.rotor.forEach(o => { o.rotation.y = P.angle; });

  // cup elevation: 4 discrete heights
  const cupTarget = [-0.24, -0.08, 0.06, 0.2][cur.cup];
  P.cupY = lerp(P.cupY, cupTarget, dt * 4);
  refs.cup.position.y = P.cupY;

  // shutter + lift pins only move during load / unload
  const open = cur.id === 'load' || cur.id === 'unload';
  P.doorY = lerp(P.doorY, open ? 0.34 : 0, dt * 4);
  refs.shutterDoor.position.y = P.doorY;
  P.liftY = lerp(P.liftY, open ? 0.05 : 0, dt * 4);
  refs.liftPins.position.y = P.liftY;

  // arms: 0 rad = over wafer center, ±swing = parked over the standby pot
  const scan = 0.273 * (0.5 - 0.5 * Math.cos(P.t * 2.0));  // center <-> wafer edge
  const targets = {
    chemArm: cur.arm === 'chem' ? scan : -refs.swing,
    rinseArm: cur.arm === 'rinse' ? scan * 0.6 : refs.swing,
    twoFluidArm: cur.id === 'sc1' ? scan * 0.8 : -refs.swing
  };
  ['chemArm', 'rinseArm', 'twoFluidArm'].forEach(k => {
    const a = refs[k];
    a.rotation.y = lerp(a.rotation.y, targets[k], dt * 3.2);
  });

  // ---- liquid -------------------------------------------------------------
  const head = cur.arm === 'chem' ? refs.chemHead : (cur.arm === 'rinse' ? refs.rinseHead : null);
  const dispensing = !!cur.liquid;
  const col = new THREE.Color(cur.liquid || 0x56ccf2);

  if (dispensing && head) {
    const tip = head.getWorldPosition(new THREE.Vector3());
    tip.y -= 0.08;
    const top = built.WAFER_Y + 0.008;
    const h = Math.max(0.02, tip.y - top);
    fx.stream.visible = true;
    fx.stream.scale.set(1, h, 1);
    fx.stream.position.set(tip.x, top + h / 2, tip.z);
    fx.stream.material.color.copy(col);
  } else {
    fx.stream.visible = false;
  }

  fx.backStream.visible = cur.id === 'backrinse';
  if (fx.backStream.visible) fx.backStream.material.color.copy(col);

  const filmOn = dispensing;
  fx.film.visible = filmOn;
  if (filmOn) {
    fx.film.material.color.copy(col);
    // film thins as the wafer speeds up
    fx.film.material.opacity = THREE.MathUtils.clamp(0.7 - P.rpm / 3500, 0.28, 0.7);
    fx.film.scale.setScalar(1);
    fx.film.position.y = built.WAFER_Y + (cur.id === 'backrinse' ? -0.02 : 0.006);
  }

  updateDroplets(dt, built, dispensing || (cur.id === 'dry' && P.t < 2.2), col);

  if (P.playing) $('#procProgress').style.width = (P.t / cur.duration * 100).toFixed(1) + '%';
  if (Math.abs(P.rpm - (P._lastShown ?? -1)) > 8) {
    P._lastShown = P.rpm;
    const el = document.getElementById('rdRpm');
    if (el) el.textContent = Math.round(P.rpm);
  }
}

function updateDroplets(dt, built, spawning, color) {
  const pts = built.refs.fx.points;
  const pos = pts.geometry.attributes.position.array;
  const vel = pts.userData.vel;
  const alive = pts.userData.alive;
  const N = alive.length;
  pts.material.color.copy(color);
  let visible = false;
  let budget = spawning ? Math.ceil(dt * 260 * Math.min(1, P.rpm / 260)) : 0;

  for (let i = 0; i < N; i++) {
    const i3 = i * 3;
    if (alive[i] > 0) {
      vel[i3 + 1] -= 3.2 * dt;
      pos[i3] += vel[i3] * dt;
      pos[i3 + 1] += vel[i3 + 1] * dt;
      pos[i3 + 2] += vel[i3 + 2] * dt;
      alive[i] -= dt;
      const r = Math.hypot(pos[i3], pos[i3 + 2]);
      if (pos[i3 + 1] < 0.3 || r > 0.47) alive[i] = 0;
      if (alive[i] > 0) visible = true;
    } else if (budget > 0) {
      budget--;
      const a = Math.random() * Math.PI * 2;
      const r = built.WAFER_R * (0.985 + Math.random() * 0.03);
      pos[i3] = Math.cos(a) * r;
      pos[i3 + 1] = built.WAFER_Y + 0.012;
      pos[i3 + 2] = Math.sin(a) * r;
      const sp = 0.35 + P.rpm / 1600;
      vel[i3] = Math.cos(a) * sp;
      vel[i3 + 1] = 0.12 + Math.random() * 0.2;
      vel[i3 + 2] = Math.sin(a) * sp;
      alive[i] = 0.35 + Math.random() * 0.3;
      visible = true;
    } else {
      pos[i3 + 1] = -99;
    }
  }
  pts.geometry.attributes.position.needsUpdate = true;
  pts.visible = visible;
}

function onStepChanged() {
  renderProcSteps();
  updateProcReadout();
}

function renderProcSteps() {
  const host = $('#procSteps');

// ---------------------------------------------------------------- quiz -----
let quizAnswers = {};
function renderQuiz() {
  const host = $('#quizList');
  if (!host) return;
  host.innerHTML = '';
  QUIZ.forEach((q, qi) => {
    const d = q[lang];
    const el = document.createElement('div');
    el.className = 'quiz-q';
    el.innerHTML = `<h3>${qi + 1}. ${d.q}</h3>` +
      d.o.map((o, oi) => `
        <label class="quiz-opt" data-q="${qi}" data-o="${oi}">
          <input type="radio" name="q${qi}" value="${oi}" ${quizAnswers[qi] === oi ? 'checked' : ''}>
          <span>${o}</span>
        </label>`).join('') +
      `<div class="quiz-explain"><b>${t(lang, 'quiz.explain')}</b><br>${d.e}</div>`;
    host.appendChild(el);
  });
  host.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener('change', e => {
      const lab = e.target.closest('.quiz-opt');
      quizAnswers[+lab.dataset.q] = +lab.dataset.o;
    });
  });
  $('#quizScore').textContent = '';
}

function bindQuiz() {
  $('#quizCheck').addEventListener('click', () => {
    let score = 0;
    QUIZ.forEach((q, qi) => {
      const card = $$('#quizList .quiz-q')[qi];
      card.querySelectorAll('.quiz-opt').forEach(lab => {
        const oi = +lab.dataset.o;
        lab.classList.remove('correct', 'wrong');
        if (oi === q.a) lab.classList.add('correct');
        else if (quizAnswers[qi] === oi) lab.classList.add('wrong');
      });
      card.querySelector('.quiz-explain').classList.add('show');
      if (quizAnswers[qi] === q.a) score++;
    });
    $('#quizScore').textContent = `${t(lang, 'quiz.score')}: ${score} / ${QUIZ.length}`;
  });
  $('#quizReset').addEventListener('click', () => { quizAnswers = {}; renderQuiz(); });
}

// ---------------------------------------------------------------- tabs -----
function bindTabs() {
  $$('#tabbar button').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.tab;
      $$('#tabbar button').forEach(b => b.classList.toggle('active', b === btn));

      if (name === 'chamber') initChamberViewer();

      if (S.tool.viewer) S.tool.viewer.setActive(name === 'overview');
      if (S.ch.viewer) S.ch.viewer.setActive(name === 'chamber');
    });
  });
}

  bindTabs();
  bindProcControls();
  bindQuiz();
  toolbarFor('tool', '#viewTool', '#slidersTool');

  applyI18n();
  initToolViewer();

  setTimeout(initChamberViewer, 600);
}

function armTo(r,x,y,z,baseZ,baseX=0){
 r.travel.position.set(baseX,y-.03,baseZ);
 let dx=x-baseX,dz=z-baseZ,d=Math.min(1.295,Math.max(.1,Math.hypot(dx,dz)));
 let bend=Math.acos(THREE.MathUtils.clamp((d*d-.65*.65-.66*.66)/(2*.65*.66),-1,1));
 let a=Math.atan2(-dz,dx)-Math.atan2(.66*Math.sin(bend),.65+.66*Math.cos(bend));
 r.shoulder.rotation.y=a;r.elbow.rotation.y=bend;
}

 if($('#infoTool .info-empty'))$('#infoTool .info-empty').innerHTML=`<div class="eyebrow">LEARNING STUDIO / 01</div><h2>${tr('welcome')}</h2><p>${tr('intro')}</p><div class="welcome-count">${tr('count')}</div><button class="proc-btn" id="startWelcome">▶ ${tr('transport')}</button>`;
 if($('#startWelcome'))$('#startWelcome').onclick=()=>$('#transportPlay').click();
 $('#transportSeek')?.setAttribute('aria-label',tr('timeline'));$('#chSeek')?.setAttribute('aria-label',tr('processline'));
 updateProcessHUD(true);
}
let lastHUD='';
function updateProcessHUD(force=false){
 const app=window.SU3200;if(!app||!$('#processObservation'))return;
 const {P}=app,key=lang()+P.idx;
 if(force||lastHUD!==key){lastHUD=key;$('#processObservation').innerHTML=`<span class="eyebrow">${tr('observe')} · ${String(P.idx+1).padStart(2,'0')} / 10</span><p>${PROCESS_STEPS[P.idx][lang()].detail}</p>`;}
 const total=PROCESS_STEPS.reduce((n,s)=>n+s.duration,0),elapsed=PROCESS_STEPS.slice(0,P.idx).reduce((n,s)=>n+s.duration,0)+P.t;
 if($('#chSeek')&&document.activeElement!==$('#chSeek'))$('#chSeek').value=elapsed/total*100;
}
window.addEventListener('DOMContentLoaded',()=>{
 const {S,P}=window.SU3200;
 const bar=document.createElement('div');bar.className='transport-bar';bar.innerHTML=`<div class="transport-row"><button class="proc-btn" id="transportPlay"></button><button class="proc-btn ghost" id="transportReset" data-ed="reset"></button><span class="route-state" id="routeReadout"></span></div><div class="transport-row"><label><span data-ed="target"></span> <select id="pmSelect">${Array.from({length:12},(_,i)=>`<option value="${i}">PM-${String(i+1).padStart(2,'0')}</option>`).join('')}</select></label><button class="proc-btn ghost" id="openPM" data-ed="detail"></button><label><span data-ed="speed"></span> <select id="toolSpeed"><option>0.5</option><option selected>1</option><option>2</option></select> ×</label></div><input id="transportSeek" type="range" min="0" max="43.99" step="0.01" value="0"><p class="micro" data-ed="simulation"></p>`;
 $('#viewTool').append(bar);
 const r=S.tool.viewer.model.userData.transport;
 $('#transportPlay').onclick=()=>{r.playing=!r.playing;if(r.playing&&S.tool.mode==='solid')$('#viewTool [data-mode=xray]').click();localize();};
 $('#transportReset').onclick=()=>{r.time=0;r.playing=false;localize();};
 $('#transportSeek').oninput=e=>{r.time=+e.target.value;r.playing=false;localize();};
 $('#pmSelect').onchange=e=>{r.target=+e.target.value;r.time=0;};
 $('#toolSpeed').onchange=e=>r.speed=+e.target.value;
 $('#openPM').onclick=()=>{ $('[data-tab=chamber]').click();$('#chPMBadge').textContent='PM-'+String(r.target+1).padStart(2,'0')+' · '+words('通用腔室模型','Generic chamber model','汎用チャンバーモデル');};
 for(const [key,sel]of [['tool','#viewTool'],['ch','#viewCh']]){
  const b=document.createElement('div');b.className='viewer-caption';b.innerHTML=`<span>${key==='tool'?'01 / TOOL EXPLORER':'02 / SINGLE CHAMBER'}</span><span data-ed="hint"></span>`;$(sel+' .canvas-host').append(b);
  if(S[key].viewer?.renderer.isCPU){const note=document.createElement('div');note.className='cpu-notice';note.textContent='WebGL unavailable · CPU 3D / 簡化繪圖 / 簡易描画';$(sel+' .canvas-host').append(note);}
  const warn=document.createElement('div');warn.className='model-note';warn.dataset.ed='generic';$(sel).append(warn);
  const full=document.createElement('button');full.className='tool-btn';full.dataset.ed='full';full.onclick=()=>{const el=$(sel),fallback=()=>{el.classList.toggle('expanded-view');S[key].viewer?.resize();};if(document.fullscreenElement)document.exitFullscreen?.();else if(el.requestFullscreen)el.requestFullscreen().catch(fallback);else fallback();};$(sel+' .toolbar .tool-group:last-child').append(full);
 }
 const mini=document.createElement('div');mini.className='ch-controls';mini.innerHTML='<button class="tool-btn" id="waferClose" data-ed="focus"></button><b id="chPMBadge">PM-01</b><label><span data-ed="speed"></span> <select id="chSpeed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select> ×</label><input type="range" id="chSeek" min="0" max="100" step="0.1" value="0"><p class="micro" data-ed="simulation"></p>';
 $('#viewCh .proc-bar').append(mini);
 $('#waferClose').onclick=()=>{const v=S.ch.viewer;v.camera.position.set(.69,1.28,1.05);v.controls.target.set(0,.7,0);v.controls.update();};
 $('#chSeek').oninput=e=>{P.playing=false;const btn=$('#procPlay');btn.innerHTML='▶ '+UI[lang()]['chamber.play'];let t=+e.target.value/100*PROCESS_STEPS.reduce((a,s)=>a+s.duration,0);for(let i=0;i<PROCESS_STEPS.length;i++){if(t<=PROCESS_STEPS[i].duration||i===PROCESS_STEPS.length-1){$('#procSteps').children[i].click();P.t=Math.min(t,PROCESS_STEPS[i].duration-.001);break;}t-=PROCESS_STEPS[i].duration;}updateProcessHUD(true);};
 const ob=document.createElement('div');ob.id='processObservation';$('#viewCh').after(ob);$('#tab-chamber .panel-right').prepend(ob);
 const offline=document.createElement('a');offline.className='offline-link';offline.href='SCREEN_DNS_SU3200_Offline.html';offline.download='SCREEN_DNS_SU3200_Offline.html';offline.dataset.ed='offline';$('.header-spacer').after(offline);
 for(const el of [$('#infoTool'),$('#infoCh')])new MutationObserver(()=>{if(el.querySelector('.info-group-tag')&&!el.querySelector('.evidence-tag')){const s=document.createElement('p');s.className='evidence-tag';s.textContent=tr('generic');el.querySelector('.info-group-tag').after(s);}}).observe(el,{childList:true});
 $('#transportSeek').setAttribute('aria-label',tr('timeline'));$('#chSeek').setAttribute('aria-label',tr('processline'));
 localize();
 document.addEventListener('lang-changed',()=>{lastHUD='';localize();});
 document.addEventListener('click',e=>{if(e.target.closest('#procSteps,#procNext,#procPrev')){P.t=0;updateProcessHUD(true);}});
 document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)){const b=$('#tab-overview.active')?$('#transportPlay'):$('#tab-chamber.active')?$('#procPlay'):null;if(b){e.preventDefault();b.click();}}});
});

return {};
})();
})();</script>
